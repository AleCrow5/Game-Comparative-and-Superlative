<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comparative Challenge</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

    <div id="home">

        <h1>

            Comparative Challenge

        </h1>

        <p>

            Learn Comparative and Superlative Adjectives

        </p>

        <button id="start">

            PLAY

        </button>

    </div>

    <div id="game">

        <div class="header">

            <div>

                ⭐ Score

                <h2 id="score">

                    0

                </h2>

            </div>

            <div>

                ⏰ Time

                <h2 id="time">

                    60

                </h2>

            </div>

        </div>

        <div class="progress">

            <div id="bar"></div>

        </div>
        <div id="stars">

            <span class="star">⭐</span>
            
            <span class="star">⭐</span>
            
            <span class="star">⭐</span>
            
            <span class="star">⭐</span>
            
            </div>

        <h2 id="question">

            Loading...

        </h2>

        <div id="words">

        </div>

        <div id="answer">

            Drop the words here

        </div>

        <div class="buttons">

            <button id="check">
        
                ✔ Check
        
            </button>
        
            <button id="shuffle">
        
                🔀 Shuffle
        
            </button>
        
            <button id="next">
        
                ➜ Next
        
            </button>
        
        </div>

        <p id="message"></p>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
